let day='26',showOptional=true;const $=id=>document.getElementById(id);const opt=p=>p.kind==='rain'||p.kind==='optional'||(p.time==='Volitelně');function mapUrl(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.lat+','+p.lon)}
function render(){let d=DATA.days.find(x=>x[0]===day);$('days').innerHTML='';for(let x of DATA.days){let b=document.createElement('button');b.textContent=x[1];b.className=x[0]===day?'active':'';b.onclick=()=>{day=x[0];$('search').value='';render()};$('days').append(b)}$('title').textContent=d[2];$('subtitle').textContent=d[3];$('note').textContent=DATA.notes[day];let q=$('search').value.trim().toLocaleLowerCase('cs');$('entries').innerHTML='';let ps=DATA.points.filter(p=>(q?(p.name+' '+p.desc).toLocaleLowerCase('cs').includes(q):p.day===day)&& (showOptional||!opt(p)));ps.forEach(p=>{let el=document.createElement('article');el.className='entry'+(opt(p)?' optional':'');let num=DATA.points.filter(x=>x.day===p.day).indexOf(p)+1;let number=document.createElement('span');number.className='number';number.textContent=num;let body=document.createElement('div');body.className='content';let title=document.createElement('h3');title.textContent=p.name;let time=document.createElement('div');time.className='time';time.textContent=p.time+(q?' · '+DATA.days.find(x=>x[0]===p.day)[1]:'');let desc=document.createElement('p');desc.className='desc';desc.textContent=p.desc;let links=document.createElement('div');links.className='links';let g=document.createElement('a');g.href=mapUrl(p);g.target='_blank';g.rel='noopener';g.textContent='📍 Google Maps';let a=document.createElement('a');a.href='https://maps.apple.com/?ll='+p.lat+','+p.lon+'&q='+encodeURIComponent(p.name);a.target='_blank';a.rel='noopener';a.className='apple';a.textContent='Apple Maps';links.append(g,a);body.append(title,time,desc,links);el.append(number,body);$('entries').append(el)});}
$('search').addEventListener('input',render);$('optional').onclick=()=>{showOptional=!showOptional;$('optional').textContent=showOptional?'Skrýt alternativy':'Zobrazit alternativy';render()};render();</script></body></html>
